<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ABAD4D SPORT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0B0E14 0%, #11161F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(18, 22, 32, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(201, 160, 61, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFFFFF, #C9A03D);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-logo p {
            font-size: 0.8rem;
            color: #C9A03D;
            margin-top: 5px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #C9A03D;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201, 160, 61, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .login-input:focus {
            outline: none;
            border-color: #C9A03D;
            background: rgba(255,255,255,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #C9A03D, #B8892A);
            border: none;
            border-radius: 12px;
            color: #0B0E14;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(201, 160, 61, 0.3);
        }
        .error-msg {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #e74c3c;
        }
        .secret-info {
            margin-top: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: #6F7C91;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <h2>ABAD4D SPORT</h2>
            <p>🔐 ADMIN PANEL</p>
        </div>
        <div id="loginError" class="error-msg" style="display: none;"></div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" class="login-input" placeholder="Masukkan username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" class="login-input" placeholder="Masukkan password">
        </div>
        <div class="input-group">
            <label>Secret Key</label>
            <input type="password" id="secretKey" class="login-input" placeholder="Masukkan secret key">
        </div>
        <button class="login-btn" onclick="adminLogin()">LOGIN ADMIN</button>
        <div class="secret-info">
            <i class="fas fa-shield-alt"></i> Hanya admin yang memiliki akses
        </div>
    </div>

    <script>
        async function adminLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const secretKey = document.getElementById('secretKey').value;
            const errorDiv = document.getElementById('loginError');

            if (!username || !password || !secretKey) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Semua field harus diisi!';
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, secretKey })
                });
                const data = await response.json();

                if (data.success) {
                    // Simpan token ke localStorage dan cookie
                    localStorage.setItem('adminToken', data.token);
                    document.cookie = `adminToken=${data.token}; path=/; max-age=86400`;
                    window.location.href = '/admin.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = data.message || 'Login gagal!';
                    // Catat percobaan login gagal (opsional: block IP setelah 5x gagal)
                }
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Gagal terhubung ke server!';
            }
        }
    </script>
</body>
</html>
